<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#163307" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="robots" content="{{ROBOTS_META}}" />
    {{CANONICAL}}
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:site_name" content="{{VENUE_NAME}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{OG_ALT}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    <meta name="geo.region" content="AU-SA" />
    <meta name="geo.placename" content="Aberfoyle Park" />
    <meta name="geo.position" content="{{GEO_POSITION}}" />
    <meta name="ICBM" content="{{GEO_ICBM}}" />
    <link rel="icon" href="/assets/brand/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    {{PRELOAD}}
    <link rel="preload" href="/assets/fonts/fraunces-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/fraunces-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/dm-sans-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/design.css?v={{VERSION}}" />
    <script>document.documentElement.classList.add('js');</script>
    <script type="application/json" id="venue-data">{{VENUE_JSON}}</script>
    <script src="/config.js?v={{VERSION}}" defer></script>
    <script src="/venue.js?v={{VERSION}}" defer></script>
    <script src="/site.js?v={{VERSION}}" defer></script>
    {{PAGE_SCRIPTS}}
    {{STRUCTURED_DATA}}
  </head>
  <body class="page-{{PAGE}}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" data-header>
      <a class="brand" href="/" aria-label="{{VENUE_NAME}}, home"
        ><img class="official-logo" src="/assets/brand/official-logo-transparent.png" alt="" width="1200" height="327"
      /></a>
      <nav class="primary-nav" id="primary-nav" aria-label="Main">
        {{NAV}}
      </nav>
      <div class="header-actions">
        <a
          class="header-link"
          href="{{SQUARE_URL}}"
          target="_blank"
          rel="noopener noreferrer"
          >Order online<span class="external" aria-hidden="true">↗</span
          ><span class="sr-only"> (opens Square in a new tab)</span></a
        >
        <a class="btn btn-primary btn-small" href="/visit/#events">Plan<span class="hide-xs">&nbsp;an event</span></a>
      </div>
      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-nav"
      >
        <span class="sr-only">Menu</span><span class="menu-toggle-lines" aria-hidden="true"></span>
      </button>
    </header>
    <main id="main">{{BODY}}</main>
    {{FOOTER}}
    <div class="mobile-dock" id="mobile-dock">
      <a class="btn btn-primary" href="/visit/#events">Plan an event</a
      ><a class="btn btn-light" href="/book/">Book a table</a>
    </div>
  </body>
</html>
